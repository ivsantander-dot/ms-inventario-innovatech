spring.application.name=ms-inventario-innovatech
spring.profiles.default=local

server.port=${SERVER_PORT:8087}
jwt.secret=${JWT_SECRET:change-me-jwt-secret-min-32-chars}
app.security.docs-public=${APP_SECURITY_DOCS_PUBLIC:false}
logging.pattern.level=%5p [requestId=%X{requestId:-na}]

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
innovatech.seed.demo-products.enabled=${INVENTARIO_DEMO_PRODUCTS_ENABLED:false}
