spring.datasource.url=jdbc:mysql://${DB_HOST:${INVENTARIO_MYSQL_HOST:localhost}}:${DB_PORT:${INVENTARIO_MYSQL_PORT:3306}}/${DB_NAME:${INVENTARIO_MYSQL_DATABASE:innovatech_inventario}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${INVENTARIO_MYSQL_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${INVENTARIO_MYSQL_PASSWORD:change_me_local_inventario}}

spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.security.docs-public=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
